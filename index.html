<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TTRPG Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>TTRPG</h1>

        <!-- Character Selection -->
        <div id="characterSelection">

            <h2>Choose your character</h2>

            <div class="characters">

                <button class="characterButton" data-character="Knight">
                    Knight
                </button>

                <button class="characterButton" data-character="Skeleton">
                    Skeleton
                </button>

                <button class="characterButton" data-character="Zombie">
                    Zombie
                </button>

                <button class="characterButton" data-character="Witch">
                    Witch
                </button>

                <button class="characterButton" data-character="Demon">
                    Demon
                </button>

                <button class="characterButton" data-character="Pumpkinman">
                    Pumpkinman
                </button>

                <button class="characterButton" data-character="Vampire">
                    Vampire
                </button>

                <button class="characterButton" data-character="Slime">
                    Slime
                </button>

                <button class="characterButton" data-character="Ghost">
                    Ghost
                </button>

                <button class="characterButton" data-character="Scarecrow">
                    Scarecrow
                </button>

            </div>

        </div>


        <!-- Controls after character selection -->
        <div id="actionSelection" class="hidden">

            <h2 id="selectedCharacter"></h2>


            <!-- Main actions -->
            <div class="mainActions">

                <button id="attackButton" class="attack">
                    ATTACK
                </button>

                <button id="blockButton" class="block">
                    BLOCK
                </button>

            </div>


            <!-- Movement / controls -->
            <div class="movement">

                <button id="leftButton" class="movementButton">
                    ← LEFT
                </button>

                <button id="rightButton" class="movementButton">
                    RIGHT →
                </button>

                <button id="skipButton" class="skipButton">
                    SKIP
                </button>

                <button id="enterButton" class="enterButton">
                    ENTER
                </button>

            </div>


            <!-- Emotes -->
            <div class="emoteSection">

                <h2>Emotes</h2>

                <div class="emotes">

                    <button class="emoteButton" data-emote="Good Job">
                        Good Job
                    </button>

                    <button class="emoteButton" data-emote="NOPE">
                        NOPE
                    </button>

                    <button class="emoteButton" data-emote="Hihi">
                        Hihi
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
