<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TTRPG Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>TTRPG</h1>

        <!-- ========================================
             ROLE / CHARACTER SELECTION
             ======================================== -->

        <div id="selectionScreen">

            <div class="dungeonMasterSection">

                <h2>Dungeon Master</h2>

                <button
                    id="dungeonMasterButton"
                    class="dungeonMasterButton"
                >
                    DUNGEON MASTER
                </button>

            </div>


            <div class="characterSection">

                <h2>Choose your character</h2>

                <div class="characters">

                    <button class="characterButton" data-character="Knight">Knight</button>
                    <button class="characterButton" data-character="Skeleton">Skeleton</button>
                    <button class="characterButton" data-character="Zombie">Zombie</button>
                    <button class="characterButton" data-character="Witch">Witch</button>
                    <button class="characterButton" data-character="Demon">Demon</button>
                    <button class="characterButton" data-character="Pumpkinman">Pumpkinman</button>
                    <button class="characterButton" data-character="Vampire">Vampire</button>
                    <button class="characterButton" data-character="Slime">Slime</button>
                    <button class="characterButton" data-character="Ghost">Ghost</button>
                    <button class="characterButton" data-character="Scarecrow">Scarecrow</button>

                </div>

            </div>

        </div>


        <!-- ========================================
             PLAYER CONTROLS
             ======================================== -->

        <div id="playerControls" class="hidden">

            <h2 id="selectedCharacter"></h2>

            <div class="mainActions">

                <button id="attackButton" class="attack">
                    ATTACK
                </button>

                <button id="blockButton" class="block">
                    BLOCK
                </button>

            </div>


            <div class="movement">

                <button id="leftButton" class="movementButton">
                    ◀
                </button>

                <button id="rightButton" class="movementButton">
                    ▶
                </button>

                <button id="skipButton" class="skipButton">
                    SKIP
                </button>

                <button id="enterButton" class="enterButton">
                    ENTER
                </button>

            </div>


            <div class="emoteSection">

                <h2>Emotes</h2>

                <div class="emotes">

                    <button class="emoteButton" data-emote="Good Job">
                        Good Job
                    </button>

                    <button class="emoteButton" data-emote="NOPE">
                        NOPE
                    </button>

                    <button class="emoteButton" data-emote="HAHA">
                        HAHA
                    </button>

                </div>

            </div>

        </div>


        <!-- ========================================
             DUNGEON MASTER CONTROLS
             ======================================== -->

        <div id="dungeonMasterControls" class="hidden">

            <h2>Dungeon Master</h2>


            <!-- ========================================
                 DM MOVEMENT
                 ======================================== -->

            <div class="movement">

                <button id="dmLeftButton" class="movementButton">
                    ◀
                </button>

                <button id="dmRightButton" class="movementButton">
                    ▶
                </button>

                <button id="dmSkipButton" class="skipButton">
                    SKIP
                </button>

                <button id="dmEnterButton" class="enterButton">
                    ENTER
                </button>

            </div>


            <!-- ========================================
                 DRAGONBABY CONTROLS
                 ======================================== -->

            <div class="dragonSection">

                <h2>Dragonbaby</h2>

                <div class="dragonButtons">

                    <button
                        id="dragonPrepareButton"
                        class="dragonPrepareButton"
                    >
                        PREPARE ATTACK
                    </button>

                    <button
                        id="dragonAttackButton"
                        class="dragonAttackButton"
                    >
                        DRAGON ATTACK
                    </button>

                    <button
                        id="dragonSkipButton"
                        class="dragonSkipButton"
                    >
                        DRAGON SKIP
                    </button>

                </div>

            </div>


            <!-- ========================================
                 CHARACTER TARGET
                 ======================================== -->

            <div class="resolveTarget">

                <h2>Choose Character</h2>

                <div class="characters dmCharacters">

                    <button class="dmCharacterButton" data-target="Knight">Knight</button>
                    <button class="dmCharacterButton" data-target="Skeleton">Skeleton</button>
                    <button class="dmCharacterButton" data-target="Zombie">Zombie</button>
                    <button class="dmCharacterButton" data-target="Witch">Witch</button>
                    <button class="dmCharacterButton" data-target="Demon">Demon</button>
                    <button class="dmCharacterButton" data-target="Pumpkinman">Pumpkinman</button>
                    <button class="dmCharacterButton" data-target="Vampire">Vampire</button>
                    <button class="dmCharacterButton" data-target="Slime">Slime</button>
                    <button class="dmCharacterButton" data-target="Ghost">Ghost</button>
                    <button class="dmCharacterButton" data-target="Scarecrow">Scarecrow</button>

                </div>

                <div id="selectedTarget" class="selectedTarget">
                    No character selected
                </div>

            </div>


            <!-- ========================================
                 LEVEL UP
                 ======================================== -->

            <div class="levelUpSection">

                <h2>Level Up</h2>

                <button id="levelUpButton" class="levelUpButton">
                    LEVEL UP
                </button>

            </div>


            <!-- ========================================
                 RESOLVE POINTS
                 ======================================== -->

            <div class="resolvePoints">

                <h2>Resolve Points</h2>

                <div class="rpGrid">

                    <button class="rpButton negative" data-rp="-1000">-1000 RP</button>
                    <button class="rpButton negative" data-rp="-500">-500 RP</button>
                    <button class="rpButton negative" data-rp="-200">-200 RP</button>
                    <button class="rpButton negative" data-rp="-100">-100 RP</button>
                    <button class="rpButton negative" data-rp="-50">-50 RP</button>
                    <button class="rpButton negative" data-rp="-20">-20 RP</button>
                    <button class="rpButton negative" data-rp="-10">-10 RP</button>

                    <button class="rpButton positive" data-rp="10">+10 RP</button>
                    <button class="rpButton positive" data-rp="20">+20 RP</button>
                    <button class="rpButton positive" data-rp="50">+50 RP</button>
                    <button class="rpButton positive" data-rp="100">+100 RP</button>
                    <button class="rpButton positive" data-rp="200">+200 RP</button>
                    <button class="rpButton positive" data-rp="500">+500 RP</button>
                    <button class="rpButton positive" data-rp="1000">+1000 RP</button>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
