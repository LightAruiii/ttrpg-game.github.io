<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TTRPG Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>TTRPG</h1>


        <!-- ========================================
             Role / Character Selection
             ======================================== -->

        <div id="selectionScreen">

            <!-- Dungeon Master -->
            <div class="dungeonMasterSection">

                <h2>Dungeon Master</h2>

                <button
                    id="dungeonMasterButton"
                    class="dungeonMasterButton"
                    data-character="Dungeon Master"
                >
                    DUNGEON MASTER
                </button>

            </div>


            <!-- Characters -->
            <div class="characterSection">

                <h2>Choose your character</h2>

                <div class="characters">

                    <button class="characterButton" data-character="Knight">
                        Knight
                    </button>

                    <button class="characterButton" data-character="Skeleton">
                        Skeleton
                    </button>

                    <button class="characterButton" data-character="Zombie">
                        Zombie
                    </button>

                    <button class="characterButton" data-character="Witch">
                        Witch
                    </button>

                    <button class="characterButton" data-character="Demon">
                        Demon
                    </button>

                    <button class="characterButton" data-character="Pumpkinman">
                        Pumpkinman
                    </button>

                    <button class="characterButton" data-character="Vampire">
                        Vampire
                    </button>

                    <button class="characterButton" data-character="Slime">
                        Slime
                    </button>

                    <button class="characterButton" data-character="Ghost">
                        Ghost
                    </button>

                    <button class="characterButton" data-character="Scarecrow">
                        Scarecrow
                    </button>

                </div>

            </div>

        </div>


        <!-- ========================================
             Player Controls
             ======================================== -->

        <div id="playerControls" class="hidden">

            <h2 id="selectedCharacter"></h2>


            <!-- Main actions -->

            <div class="mainActions">

                <button id="attackButton" class="attack">
                    ATTACK
                </button>

                <button id="blockButton" class="block">
                    BLOCK
                </button>

            </div>


            <!-- Movement / Controls -->

            <div class="movement">

                <button id="leftButton" class="movementButton">
                    ◀
                </button>

                <button id="rightButton" class="movementButton">
                    ▶
                </button>

                <button id="skipButton" class="skipButton">
                    SKIP
                </button>

                <button id="enterButton" class="enterButton">
                    ENTER
                </button>

            </div>


            <!-- Emotes -->

            <div class="emoteSection">

                <h2>Emotes</h2>

                <div class="emotes">

                    <button class="emoteButton" data-emote="Good Job">
                        Good Job
                    </button>

                    <button class="emoteButton" data-emote="NOPE">
                        NOPE
                    </button>

                    <button class="emoteButton" data-emote="Hihi">
                        Hihi
                    </button>

                </div>

            </div>

        </div>


        <!-- ========================================
             Dungeon Master Controls
             ======================================== -->

        <div id="dungeonMasterControls" class="hidden">

            <h2>Dungeon Master</h2>


            <!-- DM Movement / Controls -->

            <div class="movement dmMovement">

                <button id="dmLeftButton" class="movementButton">
                    ◀
                </button>

                <button id="dmRightButton" class="movementButton">
                    ▶
                </button>

                <button id="dmSkipButton" class="skipButton">
                    SKIP
                </button>

                <button id="dmEnterButton" class="enterButton">
                    ENTER
                </button>

            </div>


            <!-- Resolve Points -->

            <div class="resolvePoints">

                <h2>Resolve Points</h2>

                <!-- Negative -->

                <div class="rpGrid">

                    <button class="rpButton negative" data-rp="-1000">
                        -1000 RP
                    </button>

                    <button class="rpButton negative" data-rp="-500">
                        -500 RP
                    </button>

                    <button class="rpButton negative" data-rp="-200">
                        -200 RP
                    </button>

                    <button class="rpButton negative" data-rp="-100">
                        -100 RP
                    </button>

                    <button class="rpButton negative" data-rp="-50">
                        -50 RP
                    </button>

                    <button class="rpButton negative" data-rp="-20">
                        -20 RP
                    </button>

                    <button class="rpButton negative" data-rp="-10">
                        -10 RP
                    </button>


                    <!-- Positive -->

                    <button class="rpButton positive" data-rp="10">
                        +10 RP
                    </button>

                    <button class="rpButton positive" data-rp="20">
                        +20 RP
                    </button>

                    <button class="rpButton positive" data-rp="50">
                        +50 RP
                    </button>

                    <button class="rpButton positive" data-rp="100">
                        +100 RP
                    </button>

                    <button class="rpButton positive" data-rp="200">
                        +200 RP
                    </button>

                    <button class="rpButton positive" data-rp="500">
                        +500 RP
                    </button>

                    <button class="rpButton positive" data-rp="1000">
                        +1000 RP
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
